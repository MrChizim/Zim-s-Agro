<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zim's Agro</title>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: one centred column. Home = black hero, quick-record buttons, today's jobs, farm tiles; each farm opens its own page.
   Black for heroes and farm tiles (they carry the logo's artwork), white everywhere else, gold for the numbers and actions that matter. */
:root{
  --bg:#FFFFFF; --soft:#F5F5F2; --soft-2:#ECECE7; --ink:#0B0B0B; --ink-2:#3B3B3B; --mute:#75756F; --faint:#A8A8A1; --line:#E9E9E4;
  --gold:#F5C518; --gold-2:#E0AF00; --gold-soft:#FFF5CC; --gold-ink:#6A4D00;
  --good:#16803C; --good-soft:#E6F5EC; --bad:#D92D20; --bad-soft:#FDECEA; --warn:#B45309; --warn-soft:#FEF3E2;
  --d-fish:#3B82F6; --d-broil:#F59E0B; --d-turk:#B45309; --d-snail:#65A30D; --d-tool:#0B0B0B; --d-gen:#A8A8A1;
  --f-display:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.i{flex:none;vertical-align:middle}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mute{color:var(--mute)}.small{font-size:13px}.grow{flex:1}
.pos{color:var(--good)}.neg{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- shell ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:40px;height:40px;border-radius:11px;object-fit:cover;flex:none;background:var(--ink)}
.brand b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:#22C55E}.sync.busy i{background:var(--gold-2)}.sync.err{color:var(--bad)}.sync.err i{background:var(--bad)}
.topnav{display:flex;gap:4px;margin:0 auto;background:var(--soft);padding:4px;border-radius:14px}
.topnav a{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute)}
.topnav a:hover{color:var(--ink)}
.topnav a.on{background:var(--ink);color:#fff}.topnav a.on .i{color:var(--gold)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 24px 80px}
.bottombar{display:none}
@media (max-width:820px){
  .topnav,.rec-btn{display:none!important}
  .topbar-in{padding:10px 16px}
  .wrap{padding:16px 16px calc(112px + env(safe-area-inset-bottom,0px))}
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));align-items:flex-end}
  .bottombar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;font-size:11.5px;font-weight:600;color:var(--mute)}
  .bottombar a.on{color:var(--ink)}
  .bottombar a.on .i{background:var(--soft-2);border-radius:10px;padding:3px 10px;width:44px;height:26px}
  .fab{flex:none;width:60px;height:60px;border-radius:20px;background:var(--gold);color:var(--ink);border:0;display:grid;place-items:center;margin:0 6px 4px;box-shadow:0 8px 22px rgba(224,175,0,.38);cursor:pointer}
}
.stack{display:flex;flex-direction:column;gap:30px}
.sec{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font-size:21px;font-weight:600;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2 small{font-family:var(--f-ui);font-size:13.5px;font-weight:500;color:var(--mute);letter-spacing:0}
.more{font-size:13.5px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:2px}
.more:hover{color:var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--mute);margin-bottom:14px}
.back:hover{color:var(--ink)}
.eyebrow{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ---------- hero ---------- */
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:24px;position:relative;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,197,24,.26),transparent);z-index:-1}
.hero-top{display:flex;align-items:center;gap:14px}
.hero-logo{width:58px;height:58px;border-radius:16px;flex:none}
.hero h1{font-size:26px;font-weight:600;color:#fff}
.hero-num{margin-top:24px}
.hero-num span{font-size:14px;color:#B5B5AE}
.hero-num b{display:block;font-family:var(--f-display);font-size:48px;font-weight:700;color:var(--gold);letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
.hero-split>div{background:#1A1A1A;border-radius:16px;padding:12px 14px;min-width:0}
.hero-split span{display:block;font-size:12.5px;color:#A8A8A1}
.hero-split b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .seg{background:#1A1A1A;margin-top:18px}
.hero .seg button{color:#A8A8A1}.hero .seg button.on{background:#fff;color:var(--ink)}
@media (max-width:560px){.hero{padding:20px;border-radius:24px}.hero-num b{font-size:38px}.hero-split b{font-size:16px}.hero-split>div{padding:10px 11px}.hero h1{font-size:22px}.hero-logo{width:50px;height:50px}}

/* ---------- quick record ---------- */
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;background:var(--soft);border:0;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s,transform .1s}
.qbtn .qi{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.qbtn:hover{background:var(--soft-2)}
.qbtn:active{transform:scale(.97)}
.qbtn.primary .qi{background:var(--gold)}
@media (max-width:820px){.quick{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.qbtn{padding:12px 4px 10px;font-size:12.5px}}
.qrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.qrow::-webkit-scrollbar{display:none}
.qrow .qbtn{flex:none;flex-direction:row;padding:7px 14px 7px 7px;border-radius:15px;font-size:14px}
.qrow .qbtn .qi{width:34px;height:34px;border-radius:11px}

/* ---------- assistant ---------- */
.askcard{background:var(--gold-soft);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ask-head{display:flex;gap:12px;align-items:center}
.ask-head .ico{width:42px;height:42px;border-radius:14px;background:var(--ink);color:var(--gold);display:grid;place-items:center;flex:none}
.ask-head b{display:block;font-family:var(--f-display);font-size:18px;font-weight:600}
.ask-head small{display:block;color:var(--gold-ink);font-size:13px}
.askform{display:flex;gap:8px}
.askform input{flex:1;background:#fff;border-color:transparent;height:50px;border-radius:16px}
.askform .btn{height:50px;width:54px;padding:0;border-radius:16px;flex:none}
.exchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
.exchips::-webkit-scrollbar{display:none}
.exchips button{flex:none;border:0;background:rgba(255,255,255,.75);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
.chat{display:flex;flex-direction:column;gap:14px;padding-bottom:90px}
.msg{max-width:88%;padding:12px 15px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg.ai.thinking{color:var(--mute)}
.acts-list{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.act-card{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--gold-2);background:#FFFDF3;border-radius:18px;flex-wrap:wrap}
.act-card.saved{border-color:var(--line);background:#fff}.act-card.skipped{opacity:.5;border-style:dashed}
.act-card .ri-main{flex:1 1 170px}
.chatbar{position:fixed;left:0;right:0;bottom:0;z-index:29;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.chatbar .askform{max-width:1072px;margin:0 auto}
.chatbar .askform input{background:var(--soft)}
@media (max-width:820px){.chatbar{bottom:calc(76px + env(safe-area-inset-bottom,0px));padding-bottom:10px}.chat{padding-bottom:150px}}

/* ---------- today ---------- */
.today{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft);border-radius:18px;cursor:pointer;min-width:0}
.trow .tnum{flex:none;width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.trow.done .tnum{background:var(--good-soft);color:var(--good)}
.trow .tt{flex:none;width:70px;font-family:var(--f-display);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.trow .tm{flex:1;min-width:0}
.trow .tm b{display:block;font-weight:600;overflow-wrap:break-word}
.trow .tm small{display:block;color:var(--mute);font-size:13px}
.trow.next{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.trow.late .tt{color:var(--warn)}
.trow.done{opacity:.5}.trow.done .tm b{text-decoration:line-through}
.tick{appearance:none;-webkit-appearance:none;flex:none;width:28px;height:28px;margin:0;padding:0;border-radius:50%;border:2px solid #D2D2CC;background:#fff;cursor:pointer;display:grid;place-items:center}
.tick:checked{background:var(--gold);border-color:var(--gold-2)}
.tick:checked::after{content:"";width:7px;height:12px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.tick:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:560px){.trow{padding:11px 12px;gap:10px}.trow .tt{width:60px;font-size:13.5px}}

/* ---------- farm tiles ---------- */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ftile{position:relative;display:block;min-height:158px;border-radius:24px;overflow:hidden;background:#0B0B0B;color:#fff;isolation:isolate}
.ftile-art{position:absolute;right:0;top:0;height:100%;width:70%;object-fit:cover;z-index:-1;-webkit-mask-image:linear-gradient(to right,transparent,#000 50%);mask-image:linear-gradient(to right,transparent,#000 50%);transition:transform .3s ease}
.ftile:hover .ftile-art{transform:scale(1.04)}
.ftile-txt{padding:16px;display:flex;flex-direction:column;gap:1px;max-width:72%;position:relative}
.ftile-name{font-size:13.5px;font-weight:600;color:#E2E2DC}
.ftile b{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums}
.ftile small{font-size:12.5px;color:#B5B5AE}
.fstat{margin-top:10px;align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.fstat.bad{background:var(--bad)}.fstat.warn{background:var(--warn)}.fstat.ok{background:rgba(34,197,94,.25);color:#C9F7D9}.fstat.info{background:var(--gold);color:var(--ink)}
.ftile.wide{grid-column:1/-1;min-height:118px}
.ftile .tool-art{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--gold);opacity:.95}
@media (max-width:420px){.ftile{min-height:148px}.ftile b{font-size:28px}.ftile-txt{padding:14px}}

/* ---------- farm / batch pages ---------- */
.fhero{position:relative;border-radius:28px;overflow:hidden;background:#0B0B0B;color:#fff;min-height:200px;display:flex;align-items:flex-end;isolation:isolate;margin-bottom:14px}
.fhero-art{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;z-index:-1;-webkit-mask-image:linear-gradient(to right,transparent,#000 45%);mask-image:linear-gradient(to right,transparent,#000 45%)}
.fhero .tool-art{position:absolute;right:28px;top:28px;color:var(--gold)}
.fhero-txt{padding:24px;max-width:70%}
.fhero h1{font-size:46px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.fhero h1 span{font-family:var(--f-ui);font-size:17px;color:#fff;font-weight:500;letter-spacing:0;margin-left:4px}
.fhero p{margin:6px 0 0;color:#B5B5AE;font-size:14px}
@media (max-width:560px){.fhero{min-height:170px;border-radius:24px}.fhero h1{font-size:36px}.fhero-txt{padding:20px;max-width:80%}}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:12px}
.bcard{display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:22px;background:var(--soft);transition:background .15s;min-width:0}
.bcard:hover{background:var(--soft-2)}
.bcard h3{font-size:19px;font-weight:600}
.bc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bc-count b{font-family:var(--f-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.bc-count span{color:var(--mute);margin-left:6px;font-size:14px}
.track{height:8px;border-radius:99px;background:#fff;overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);border-radius:99px}
.track.lg{height:10px;background:var(--soft)}
.bc-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mute)}
.bc-meta span{display:inline-flex;gap:5px;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;min-width:0}
.panel h1{font-size:30px;font-weight:600}
.big-count{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.big-count b{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big-count span{color:var(--mute);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.tile{background:var(--soft);border-radius:16px;padding:12px 14px;min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--mute)}
.tile b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
@media (max-width:560px){.tile{padding:10px 11px}.tile b{font-size:16px}.panel{padding:18px;border-radius:22px}.big-count b{font-size:44px}}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:13.5px}
.meta span{display:inline-flex;align-items:center;gap:6px}
details.closed summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--mute);margin:12px 0}
details.closed summary::-webkit-details-marker{display:none}
details[open] summary .i{transform:rotate(180deg)}

/* ---------- rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft);border-radius:18px;min-width:0}
.ri.tap{cursor:pointer;transition:background .15s}.ri.tap:hover{background:var(--soft-2)}
.ri-ico{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;flex:none}
.ri-ico.bad{background:var(--bad-soft);color:var(--bad)}.ri-ico.good{background:var(--good-soft);color:var(--good)}
.ri-ico.warn{background:var(--warn-soft);color:var(--warn)}.ri-ico.gold{background:var(--gold);color:var(--ink)}.ri-ico.dark{background:var(--ink);color:var(--gold)}
.ri-main{flex:1 1 170px;min-width:0}
.ri{flex-wrap:wrap}
.ri-main b{display:block;font-weight:600;overflow-wrap:break-word}
.ri-main small{display:block;color:var(--mute);font-size:13px;overflow-wrap:break-word}
.ri-right{flex:none;display:flex;align-items:center;gap:6px;text-align:right;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;font-family:var(--f-display);font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}
.chipline{display:flex;gap:8px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;background:var(--soft);font-size:13.5px;font-weight:600;cursor:pointer}
.mchip small{color:var(--mute);font-weight:500}
.time-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:9px;background:#fff;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* ---------- charts & guides ---------- */
.chart-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft);border-radius:18px;min-width:0}
.chart-row .day{flex:none;width:54px;height:54px;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.chart-row .day small{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.chart-row .day b{font-family:var(--f-display);font-size:20px;font-weight:700}
.chart-row.done{opacity:.55}.chart-row.done .main b{text-decoration:line-through}
.chart-row.late .day{background:var(--bad-soft);color:var(--bad)}
.chart-row.today .day{background:var(--gold)}
.chart-row .main{flex:1 1 150px;min-width:0}.chart-row .main b{display:block;font-weight:600}.chart-row .main small{display:block;color:var(--mute);font-size:13px}
.chart-row .acts{display:flex;gap:6px;align-items:center;margin-left:auto}
.chart-row{flex-wrap:wrap}
.bell{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#fff;color:var(--ink);flex:none}
.bell:hover{background:var(--gold-soft)}
.guide{background:var(--ink);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px}
.guide .eyebrow{color:#A8A8A1}
.guide b.big{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--gold);line-height:1.1}
.guide p{margin:0;color:#D6D6CF;font-size:14px}
.guide small{color:#A8A8A1;font-size:12.5px}
.spark{width:100%;height:auto;display:block}
a.time-chip{color:var(--ink)}a.time-chip:hover{background:var(--gold-soft)}

/* ---------- cost sheets ---------- */
.sheet-t{width:100%;border-collapse:collapse;font-size:14.5px}
.sheet-t td{padding:9px 2px;border-bottom:1px solid var(--line);white-space:normal;vertical-align:top}
.sheet-t td:last-child{text-align:right;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.sheet-t td small{display:block;color:var(--mute);font-size:12.5px;font-family:var(--f-ui);font-weight:500}
.sheet-t tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700;font-size:15.5px}
.sheet-t tr.head td{padding-top:16px;border-bottom:0;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-family:var(--f-ui)}
.sheet-t tr.big td:last-child{font-size:20px}
.grid-t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
.grid-t th,.grid-t td{padding:8px 8px;border:1px solid var(--line);text-align:left;white-space:nowrap}
.grid-t th{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.grid-t td.n,.grid-t th.n{text-align:right;font-variant-numeric:tabular-nums}
.grid-t tbody tr{cursor:pointer}.grid-t tbody tr:hover td{background:#FCFCFA}
.grid-t tfoot td{font-weight:700;background:var(--soft)}

/* ---------- money ---------- */
.hbars{display:flex;flex-direction:column;gap:14px}
.hbar{display:grid;grid-template-columns:100px minmax(0,1fr) auto;align-items:center;gap:12px}
.hbar .bars{display:flex;flex-direction:column;gap:4px}
.hbar .bars i{display:block;height:9px;border-radius:99px;min-width:3px}
.hbar .v{text-align:right;font-family:var(--f-display);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.hbar .v small{display:block;color:var(--mute);font-family:var(--f-ui);font-weight:500;font-size:12px}
@media (max-width:420px){.hbar{grid-template-columns:78px minmax(0,1fr) auto;gap:8px}}
.chart{position:relative;height:200px;display:flex;align-items:flex-end;gap:10px;padding:18px 0 26px;border-bottom:1px solid var(--line)}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:11px;color:var(--faint)}
.chart .gl span{position:absolute;left:0;top:-17px;font-variant-numeric:tabular-nums}
.mon{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;position:relative;z-index:1}
.pair{display:flex;gap:4px;align-items:flex-end;height:100%}
.bar{width:16px;border-radius:6px 6px 2px 2px;min-height:3px}
.bar.in{background:var(--gold)}.bar.out{background:var(--ink)}
.mon small{position:absolute;bottom:-24px;color:var(--mute);font-size:12px;font-weight:500}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.box{background:var(--soft);border-radius:24px;padding:20px;min-width:0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:13px;border:1px solid transparent;font-size:14.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.btn-primary{background:var(--gold);color:var(--ink)}.btn-primary:hover{background:var(--gold-2)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#262626}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:#fff;color:var(--bad);border-color:#F4C4BF}.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:11px;gap:6px}
.btn-lg{height:52px;padding:0 26px;font-size:16px;border-radius:16px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;border:0;background:transparent;color:var(--mute);cursor:pointer;flex:none}
.ib:hover{background:var(--soft-2);color:var(--ink)}
.ib.danger:hover{background:var(--bad-soft);color:var(--bad)}
.eb{display:inline-flex;gap:2px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft-2);color:var(--ink-2);white-space:nowrap;line-height:1.5;font-family:var(--f-ui)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.yel{background:var(--gold-soft);color:var(--gold-ink)}.pill.dark{background:var(--ink);color:#fff}
.farm{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.farm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--d-gen))}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 20px;color:var(--mute);background:var(--soft);border-radius:22px;font-size:14.5px}
.empty .ico{width:46px;height:46px;border-radius:15px;background:#fff;color:var(--ink);display:grid;place-items:center}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);color:var(--gold-ink);border-radius:16px;padding:12px 14px;font-size:14px;margin:0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note .i{margin-top:2px}
.seg{display:inline-flex;gap:2px;background:var(--soft);border-radius:13px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;color:var(--mute);height:34px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 13px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input,select{height:46px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(245,197,24,.45)}
input[readonly]{background:var(--soft);font-weight:600}
input::placeholder,textarea::placeholder{color:var(--faint)}
.search{position:relative;display:block}
.search .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{padding-left:40px}

/* quick-record sheet */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:8px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;line-height:1.25}
.chip-btn:hover{border-color:#CFCFC8}
.chip-btn small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.chip-btn i{width:8px;height:8px;border-radius:50%;flex:none}
.chip-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-btn.on small{color:#C9C9C2}
.chip-btn.dis{opacity:.45}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:54px;height:54px;border-radius:16px;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer;flex:none}
.stepper button:active{background:var(--soft-2)}
.stepper input{width:130px;height:54px;text-align:center;font-family:var(--f-display);font-size:26px;font-weight:600;border-radius:16px}
.stepper .unit{color:var(--mute);font-weight:600}
.qin{position:relative}
.qin .pre{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-size:19px;color:var(--mute);pointer-events:none}
.qin .pre+input{padding-left:38px}
.qin.big input{height:62px;font-family:var(--f-display);font-size:28px;font-weight:600}
.qin.big .pre{font-size:24px}
.qf{display:flex;flex-direction:column;gap:9px}
.qf>label{font-weight:700;font-size:14px}
.qf>small{color:var(--mute);font-size:12.5px}
.qtotal{background:var(--ink);color:#fff;border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.qtotal span{color:#B5B5AE;font-size:14px}
.qtotal b{font-family:var(--f-display);font-size:28px;color:var(--gold);font-variant-numeric:tabular-nums}
#sheet{border:0;padding:0;width:min(580px,calc(100vw - 24px));max-height:88vh;border-radius:28px;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.28)}
#sheet[open]{display:flex;flex-direction:column}
#sheet::backdrop{background:rgba(10,10,10,.45)}
.sh-head{display:flex;align-items:center;gap:12px;padding:20px 20px 8px}
.sh-ico{width:42px;height:42px;border-radius:13px;background:var(--gold);display:grid;place-items:center;flex:none}
.sh-head h2{flex:1;font-size:22px;font-weight:600}
.sh-body{padding:10px 20px 22px;overflow:auto;display:flex;flex-direction:column;gap:22px}
.sh-foot{display:flex;gap:10px;align-items:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
#qErr{flex:1;color:var(--bad);font-size:13.5px;margin:0;min-width:120px}
@media (max-width:820px){#sheet{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:28px 28px 0 0;max-height:92vh}}
.pick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pick{display:flex;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--soft);border:0;cursor:pointer;text-align:left;min-width:0}
.pick:hover{background:var(--soft-2)}
.pick b{display:block;font-size:15px}.pick small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3}
.pick .qi{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;flex:none}
@media (max-width:420px){.pick-grid{grid-template-columns:minmax(0,1fr)}}

/* full forms + confirm box */
dialog#dlg,dialog#askDlg{border:0;border-radius:24px;padding:0;width:min(660px,calc(100vw - 24px));max-height:90vh;background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,10,10,.45)}
dialog form{display:flex;flex-direction:column;max-height:90vh}
.mh{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mh h2{flex:1;font-size:20px;font-weight:600}
#mBody{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px;overflow:auto}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.fld small{color:var(--mute);font-size:12px}
.fld.full{grid-column:1/-1}
@media (max-width:560px){#mBody{grid-template-columns:1fr}}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
#mErr{color:var(--bad);flex:1;margin:0;font-size:13.5px}
dialog#askDlg{width:min(440px,calc(100vw - 24px))}
#askDlg .ab{padding:22px 20px 6px;white-space:pre-wrap;font-size:15.5px}
#askDlg input{margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;font-size:14.5px;display:flex;gap:10px;align-items:center;transition:transform .25s ease;z-index:100;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.22);max-width:calc(100vw - 32px)}
#toast .i{color:var(--gold)}
#toast.show{transform:translateX(-50%)}
@media (max-width:820px){#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
.tw{overflow-x:auto;border-radius:16px;background:#fff;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.set{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.set{grid-template-columns:1fr}}
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;font-size:15px}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:9px;background:var(--gold);font-family:var(--f-display);font-size:13px;font-weight:700;display:grid;place-items:center}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/home"><img class="brand-logo" id="brandLogo" alt="Zim's Agro logo"><span><b id="brandName">Zim's Agro</b><span class="sync" id="sync"><i></i><span>Saved on this device</span></span></span></a>
      <nav class="topnav" id="topnav"></nav>
      <button class="btn btn-primary rec-btn" data-act="record" id="recBtn">Record</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <nav class="bottombar" id="bottomnav"></nav>
</div>

<dialog id="sheet"><div id="sheetBody" style="display:contents"></div></dialog>
<dialog id="dlg">
  <form id="frm" novalidate>
    <div class="mh"><h2 id="mTitle">Add</h2><button type="button" class="ib" data-close aria-label="Close" id="mClose"></button></div>
    <div id="mBody"></div>
    <div class="mf"><p id="mErr"></p><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-dark">Save</button></div>
  </form>
</dialog>
<dialog id="askDlg"><form id="askFrm" method="dialog"><div class="ab"><div id="askMsg"></div><input id="askIn" hidden autocomplete="off"></div>
  <div class="mf"><span class="grow"></span><button type="button" class="btn btn-ghost" id="askNo">Cancel</button><button type="submit" class="btn btn-dark" id="askYes">OK</button></div></form></dialog>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

/* ============ basics ============ */
const KEY = 'zimsAgro.v1';
const ENTS = ['Catfish','Broilers','Turkeys','Snails','Tool Plug','General'];
const LIVE_ENTS = ['Catfish','Broilers','Turkeys','Snails'];
const DOT = {Catfish:'--d-fish', Broilers:'--d-broil', Turkeys:'--d-turk', Snails:'--d-snail', 'Tool Plug':'--d-tool', General:'--d-gen'};
const COLS = ['bags','routines','checkins','units','batches','mortality','weights','feedlog','medicines','doses','expenses','sales','staff','payroll','tools','rentals','inventory','todos','guides','mistakes','shops'];
const $ = (s, el = document) => el.querySelector(s);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const round = n => Math.round(num(n) * 100) / 100;
const sum = (arr, k) => arr.reduce((a, r) => a + (typeof k === 'function' ? num(k(r)) : num(r[k])), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const addDays = (d, n) => { const x = new Date(d + 'T12:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const nowHM = () => { const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '';
const fmtDay = d => d ? new Date(d + 'T00:00').toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short'}) : '';
const fmtN = n => num(n).toLocaleString(undefined, {maximumFractionDigits: 2});
const money = n => { n = num(n); return (n < 0 ? '-' : '') + S.settings.currency + Math.abs(n).toLocaleString(undefined, {maximumFractionDigits: 2}); };
const fmtW = g => !num(g) ? '—' : num(g) >= 1000 ? (num(g) / 1000).toFixed(2) + ' kg' : Math.round(num(g)) + ' g';
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + String(m).padStart(2,'0') + (h < 12 ? ' AM' : ' PM'); };
const pill = (t, cls = '') => `<span class="pill ${cls}">${esc(t)}</span>`;
const farm = e => e ? `<span class="farm" style="--dot:var(${DOT[e] || '--d-gen'})">${esc(e)}</span>` : '';
const empty = (t, icon = 'box', btn = '') => `<div class="empty"><div class="ico">${I(icon, 20)}</div><div>${t}</div>${btn}</div>`;
const byId = (col, id) => id ? S[col].find(r => r.id === id) : undefined;
const nameOf = (col, id) => { const r = byId(col, id); return r ? (r.name || r.label || '') : ''; };
const stat = (label, val, {cls = '', icon = '', foot = ''} = {}) => `<div class="stat ${cls}"><div class="lbl">${icon ? `<span class="ico">${I(icon, 16)}</span>` : ''}${label}</div><div class="val">${val}</div>${foot ? `<div class="foot">${foot}</div>` : ''}</div>`;
const mini = items => `<div class="stats-sm">${items.map(([l, v, c]) => `<div><span>${l}</span><b class="${c || ''}">${v}</b></div>`).join('')}</div>`;
const monthName = ym => new Date(ym + '-01T00:00').toLocaleDateString(undefined, {month:'short', year:'2-digit'});
const card = (title, body, more = '') => `<section class="card"><div class="card-h"><h3>${title}</h3>${more}</div>${body}</section>`;
const more = (to, label) => `<a class="more" href="#/${to}">${label}${I('chevron-right', 15)}</a>`;

function blank(seed = true) {
  return {
    settings: {farmName: "Zim's Agro", currency: '₦', owner: '', lastBackup: ''},
    bags: [], routines: [], checkins: [], units: [], batches: [], mortality: [], weights: [], feedlog: [], medicines: [], doses: [],
    expenses: [], sales: [], staff: [], payroll: [],
    tools: seed ? seedTools() : [], rentals: [], inventory: [], todos: [],
    guides: seed ? seedGuides() : [], mistakes: [], shops: [], fed: {}
  };
}
/* Poultry used to be one farm; it is now Broilers and Turkeys */
function migrate(D) {
  let changed = false;
  COLS.forEach(c => (D[c] = Array.isArray(D[c]) ? D[c] : []).forEach(r => {
    if (r.ent === 'Tool Rental') { r.ent = 'Tool Plug'; changed = true; }
    if (r.ent === 'Poultry') { r.ent = /turk|poult/i.test([r.type, r.title, r.name, r.item, r.desc].join(' ')) ? 'Turkeys' : 'Broilers'; changed = true; }
  }));
  return changed;
}
function load(seed) {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); const b = blank(false); const out = {...b, ...d, settings: {...b.settings, ...(d.settings || {})}}; migrate(out); return out; }
  } catch (e) {}
  return blank(seed);
}

/* --- saving: on this device only (file opened directly), or online so every phone/computer sees the same records --- */
let DB = null, DL = null, ONLINE_READY = false;
const SYNCED = {}; COLS.forEach(c => SYNCED[c] = new Map()); SYNCED.meta = new Map();
const stable = v => v === null || typeof v !== 'object' ? JSON.stringify(v) :
  Array.isArray(v) ? '[' + v.map(x => x === undefined ? 'null' : stable(x)).join(',') + ']' :
  '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
const plain = v => JSON.parse(JSON.stringify(v));
function cacheLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function setSync(state, text) { const el = $('#sync'); if (!el) return; el.className = 'sync ' + state; el.lastElementChild.textContent = text; }
function save() {
  cacheLocal();
  if (DB) { if (ONLINE_READY) queueSync(); return; }
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save on this device. Download a backup in Settings.', 'alert-triangle'); }
}
const metaDocs = () => [['settings', S.settings], ['fed', {days: S.fed || {}}]];
let syncing = false, syncAgain = false;
async function queueSync() {
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('busy', 'Saving…');
  let failed = null;
  try { do { syncAgain = false; failed = await syncOnce() || failed; } while (syncAgain); }
  finally { syncing = false; }
  if (failed) { setSync('err', 'Not saved. Check internet'); toast(failed === 'quota_exceeded' ? 'Storage is full. Delete old records.' : 'Not saved online. Check your internet; it retries on your next change.', 'alert-triangle'); }
  else setSync('ok', 'Saved online');
}
async function syncOnce() {
  const ops = [];
  for (const c of COLS) {
    const seen = new Set();
    for (const r of S[c]) {
      seen.add(r.id); const j = stable(r);
      if (SYNCED[c].get(r.id) !== j) ops.push({path: c + '/' + r.id, body: plain(r), done: () => SYNCED[c].set(r.id, j)});
    }
    for (const id of [...SYNCED[c].keys()]) if (!seen.has(id)) ops.push({path: c + '/' + id, body: null, done: () => SYNCED[c].delete(id)});
  }
  for (const [k, v] of metaDocs()) { const j = stable(v); if (SYNCED.meta.get(k) !== j) ops.push({path: 'meta/' + k, body: plain(v), done: () => SYNCED.meta.set(k, j)}); }
  let failed = null, i = 0;
  const worker = async () => {
    while (i < ops.length) {
      const op = ops[i++];
      for (let attempt = 0; attempt < 2; attempt++) {
        try { op.body ? await DB.doc(op.path).set(op.body) : await DB.doc(op.path).delete(); op.done(); break; }
        catch (e) {
          if (attempt === 0 && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 400 + Math.random() * 800)); continue; }
          failed = e.code || 'error'; break;
        }
      }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  return failed;
}
let renderTimer = 0;
function softRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && $('#view').contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) { softRender(); return; }
    render();
  }, 120);
}

/* --- own hosting: Google Firebase (Firestore + Google sign-in) --- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function signInScreen(msg) {
  let el = document.getElementById('signin');
  if (!el) { el = document.createElement('div'); el.id = 'signin'; document.body.appendChild(el); }
  el.style.cssText = 'position:fixed;inset:0;z-index:200;background:#0B0B0B;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center';
  el.innerHTML = `<img src="${ART.logo}" alt="" style="width:96px;height:96px;border-radius:24px"><h1 style="font-family:var(--f-display);font-size:28px">Zim's Agro</h1>
    <p style="color:#B5B5AE;max-width:320px;margin:0">${msg || 'Sign in with your Google account to open your farm records.'}</p>
    <button class="btn btn-primary btn-lg" id="googleIn">${I('user', 18)}Sign in with Google</button>`;
  document.getElementById('googleIn').onclick = async () => {
    const prov = new firebase.auth.GoogleAuthProvider();
    try { await firebase.auth().signInWithPopup(prov); location.reload(); }
    catch (e) { if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment' || e.code === 'auth/cancelled-popup-request')) firebase.auth().signInWithRedirect(prov); else signInScreen('Sign-in did not work: ' + esc(e && e.message || '') + ' Please try again.'); }
  };
}
async function startFirebase() {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /PASTE/.test(cfg.apiKey)) return null;
  try {
    const v = '10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
    await Promise.all([loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`), loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`)]);
  } catch (e) { setSync('err', 'Offline. Showing saved copy'); return null; }
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs: true}).catch(() => {});
  firebase.auth().getRedirectResult().catch(e => signInScreen('Sign-in did not work: ' + esc(e && e.message || '') + ' Please try again.'));
  const user = await new Promise(res => { const un = firebase.auth().onAuthStateChanged(u => { un(); res(u); }); setTimeout(() => res(firebase.auth().currentUser), 8000); });
  if (!user) { signInScreen(); return null; }
  window.FIREBASE_USER = user;
  const base = fs.collection('users').doc(user.uid);
  const wrap = s => ({id: s.id, exists: s.exists, data: () => s.data(), metadata: s.metadata});
  return {
    doc: path => { const [c, id] = path.split('/'); const r = base.collection(c).doc(id);
      return {set: d => r.set(d), delete: () => r.delete(), onSnapshot: (n, e) => r.onSnapshot(s => n(wrap(s)), e)}; },
    collection: c => ({onSnapshot: (n, e) => base.collection(c).onSnapshot(s => n({docs: s.docs.map(wrap)}), e)})
  };
}
async function startOnline() {
  let db = null;
  if (window.FIREBASE_CONFIG) db = await startFirebase();
  else if (window.claude && window.claude.use) { try { db = await window.claude.use('db'); } catch (e) {} }
  if (!db) return;
  DB = db;
  S = load(false);
  setSync('busy', 'Loading…'); render();
  if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d; }).catch(() => {});
  const first = new Set(), need = COLS.length + 2;
  const arrived = key => {
    if (first.has(key)) return;
    first.add(key);
    if (first.size === need) {
      ONLINE_READY = true; setSync('ok', 'Saved online'); cacheLocal();
      if (migrate(S)) { save(); softRender(); } else if (syncAgain) queueSync();
    }
  };
  const fail = e => { if (e && e.code !== 'unavailable') setSync('err', 'Offline. Showing saved copy'); };
  COLS.forEach(c => DB.collection(c).onSnapshot(snap => {
    const remote = new Map(snap.docs.map(d => [d.id, plain(d.data())]));
    const local = new Map(S[c].map(r => [r.id, r]));
    const out = []; let dirtyKept = false;
    if (first.has(c)) {
      // keep edits made here that have not reached the server yet
      for (const [id, r] of local) { const was = SYNCED[c].get(id); if (was === undefined || was !== stable(r)) { if (!remote.has(id) && was !== undefined) continue; out.push(r); remote.delete(id); dirtyKept = true; } }
      for (const id of SYNCED[c].keys()) if (!local.has(id)) remote.delete(id);
    }
    for (const r of remote.values()) out.push(r);
    SYNCED[c] = new Map(snap.docs.map(d => [d.id, stable(plain(d.data()))]));
    S[c] = out; arrived(c); cacheLocal(); softRender();
    if (dirtyKept && ONLINE_READY && !syncing) queueSync();
  }, fail));
  DB.doc('meta/settings').onSnapshot(snap => {
    if (snap.exists) { const d = plain(snap.data()); SYNCED.meta.set('settings', stable(d)); if (!syncing) S.settings = {...blank(false).settings, ...d}; }
    else if (!first.has('settings')) { S.settings = blank(false).settings; }
    arrived('settings'); cacheLocal(); softRender();
  }, fail);
  DB.doc('meta/fed').onSnapshot(snap => {
    if (snap.exists) { const d = plain(snap.data()); SYNCED.meta.set('fed', stable(d)); if (!syncing) S.fed = d.days || {}; }
    else if (!first.has('fed')) S.fed = {};
    arrived('fed'); softRender();
  }, fail);
}

/* in-page confirm / question box (pop-up dialogs are blocked online) */
function ask(msg, {ok = 'OK', danger = false, input = null, cancel = 'Cancel'} = {}) {
  return new Promise(res => {
    const d = $('#askDlg'), inp = $('#askIn');
    $('#askMsg').textContent = msg;
    $('#askYes').textContent = ok; $('#askYes').className = danger ? 'btn btn-danger' : 'btn btn-dark';
    $('#askNo').textContent = cancel;
    inp.hidden = input === null; inp.value = input ?? '';
    let result = null;
    $('#askNo').onclick = () => d.close();
    $('#askFrm').onsubmit = e => { e.preventDefault(); result = input === null ? true : inp.value; d.close(); };
    d.onclose = () => res(result);
    d.showModal();
    if (input !== null) inp.focus();
  });
}
function toast(msg, icon = 'check') {
  const t = $('#toast'); t.innerHTML = I(icon, 17) + '<span></span>'; t.lastChild.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
async function download(name, text, type) {
  if (DL) {
    try { await DL.save({filename: name, data: text}); toast('Downloaded'); return true; }
    catch (e) { if (e && e.code !== 'declined') toast('Could not download here', 'alert-triangle'); return false; }
  }
  if (DB && window.claude) { toast('Downloads are not available in this view', 'alert-triangle'); return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Downloaded'); return true;
}

/* ============ calculations ============ */
function batchStats(b) {
  const id = b.id;
  const sales = S.sales.filter(s => s.batch === id);
  const ws = S.weights.filter(w => w.batch === id).sort((a, c) => (a.date || '').localeCompare(c.date || ''));
  const dead = sum(S.mortality.filter(m => m.batch === id), 'count');
  const sold = sum(sales, 'heads');
  const qty = num(b.qty);
  const current = Math.max(0, qty - dead - sold - num(b.processed));
  const purchase = qty * num(b.unitCost);
  const feedCost = sum(S.bags.filter(g => (g.batches || []).includes(id)), g => num(g.price) * shareOf(g.batches, id)) + sum(S.feedlog.filter(f => f.batch === id && !f.bag), f => { if (num(f.cost)) return num(f.cost); const i = f.stock && byId('inventory', f.stock); return i && num(i.price) ? num(f.kg) / kgPer(i) * num(i.price) : 0; });
  const linked = S.expenses.filter(e => e.batch === id || (e.batches || []).includes(id) || (e.shares && num(e.shares[id]))).map(e => ({...e, part: e.batch === id ? num(e.amount) : e.shares ? num(e.amount) * num(e.shares[id]) : num(e.amount) * shareOf(e.batches, id)}));
  const medCost = sum(linked.filter(e => e.cat === 'Medication & vaccines'), 'part') + sum(S.doses.filter(d => d.batch === id && d.status === 'Given' && num(d.use)), d => { const m = byId('medicines', d.med); return m ? num(d.use) * num(m.price) : 0; });
  const expense = sum(linked.filter(e => e.cat !== 'Medication & vaccines' && !(feedCost && e.cat === 'Feed')), 'part') + medCost;
  const otherCost = expense - medCost;
  const income = sum(sales, 'total');
  const avg = ws.length ? num(ws[ws.length - 1].avg) : num(b.startWeight);
  const feed = sum(S.feedlog.filter(f => f.batch === id), 'kg');
  const age = (b.start ? Math.max(0, daysBetween(b.start, today())) : 0) + num(b.ageDays);
  const gain = (current + sold) * avg / 1000 - qty * num(b.startWeight) / 1000;
  return {
    dead, sold, current, purchase, expense, income, avg, feed, age,
    biomass: current * avg / 1000,
    fcr: feed > 0 && gain > 0 && ws.length ? feed / gain : 0,
    feedCost, medCost, otherCost,
    profit: income - purchase - expense - feedCost,
    mortRate: qty ? dead / qty * 100 : 0,
    unit: byId('units', b.unit),
    withdrawal: withdrawalUntil(id)
  };
}
function withdrawalUntil(batchId, asOf = today()) {
  let end = '';
  S.doses.filter(d => d.batch === batchId && d.status === 'Given' && d.date).forEach(d => {
    const m = byId('medicines', d.med); const w = m ? num(m.withdrawal) : 0;
    if (w > 0) { const e = addDays(d.date, w); if (e > end) end = e; }
  });
  return end && end > asOf ? end : '';
}
const medLow = m => m.minQty !== '' && m.minQty != null && num(m.qty) <= num(m.minQty);
const expiryState = m => !m.expiry ? '' : m.expiry < today() ? 'expired' : daysBetween(today(), m.expiry) <= 30 ? 'soon' : '';
const doseLate = d => d.status === 'Planned' && (d.date < today() || (d.date === today() && d.time && d.time < nowHM()));
const doseBadge = d => d.status === 'Given' ? pill('Given', 'good') : d.status === 'Skipped' ? pill('Skipped') : doseLate(d) ? pill('Overdue', 'bad') : pill('Planned', 'yel');
function toolStats(t) {
  const rs = S.rentals.filter(r => r.tool === t.id);
  const out = sum(rs.filter(r => !r.returned), 'qty');
  const income = sum(rs, 'amount');
  const cost = num(t.qty) * num(t.unitCost);
  return {out, avail: num(t.qty) - out, income, cost, profit: income - cost, times: rs.length, roi: cost ? income / cost * 100 : 0};
}
const rentalState = r => r.returned ? 'Returned' : (r.due && r.due < today() ? 'Overdue' : 'Out');
const rentalBadge = r => { const s = rentalState(r); return pill(s, s === 'Returned' ? 'good' : s === 'Overdue' ? 'bad' : 'yel'); };
function invStatus(i) {
  if (i.status === 'Need to buy') return 'buy';
  if (i.status === 'Running low') return 'low';
  if (i.minQty !== '' && i.minQty != null && num(i.qty) <= num(i.minQty)) return 'low';
  if (i.cat === 'Feed') { const dl = feedDaysLeft(i); if (dl !== null && dl <= 4) return 'low'; }
  return 'ok';
}
const invBadge = i => ({buy: pill('Need to buy', 'bad'), low: pill('Running low', 'warn'), ok: pill('Have', 'good')})[invStatus(i)];
const shoppingItems = () => [
  ...S.inventory.filter(i => invStatus(i) !== 'ok').map(i => ({...i, _col: 'inventory'})),
  ...S.medicines.filter(m => medLow(m) || expiryState(m) === 'expired').map(m => ({...m, item: m.name, _col: 'medicines'}))
];

/* every naira in or out, from every part of the app */
function ledger() {
  const L = [];
  S.expenses.forEach(e => L.push({date: e.date, ent: e.ent, dir: 'out', cat: e.cat || 'Other', desc: e.desc, amount: num(e.amount)}));
  S.bags.forEach(g => L.push({date: g.bought, ent: g.ent || bEnt((g.batches || [])[0]) || 'General', dir: 'out', cat: 'Feed', desc: g.feed + ' (bag)', amount: num(g.price)}));
  S.batches.forEach(b => { const a = num(b.qty) * num(b.unitCost); if (a) L.push({date: b.start, ent: b.ent, dir: 'out', cat: 'Livestock purchase', desc: b.name, amount: a}); });
  S.payroll.forEach(p => { const s = byId('staff', p.staff); L.push({date: p.date, ent: s?.ent || 'General', dir: 'out', cat: 'Salaries & wages', desc: (s?.name || 'Staff') + (p.period ? ' – ' + monthName(p.period) : ''), amount: num(p.net)}); });
  S.tools.forEach(t => { const a = num(t.qty) * num(t.unitCost); if (a) L.push({date: t.bought, ent: 'Tool Plug', dir: 'out', cat: 'Tool purchase', desc: fmtN(t.qty) + ' × ' + t.name, amount: a}); });
  S.sales.forEach(s => L.push({date: s.date, ent: s.ent, dir: 'in', cat: 'Sales', desc: s.item + (s.buyer ? ' to ' + s.buyer : ''), amount: num(s.total)}));
  S.rentals.forEach(r => L.push({date: r.dateOut, ent: 'Tool Plug', dir: 'in', cat: 'Rental income', desc: nameOf('tools', r.tool) + ' to ' + r.renter, amount: num(r.amount)}));
  return L.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
}
const PERIODS = [['month','This month'], ['30','30 days'], ['year','This year'], ['all','All time']];
function inPeriod(d, p) {
  if (p === 'all') return true;
  if (!d) return false;
  const t = today();
  if (p === 'month') return d.slice(0, 7) === t.slice(0, 7);
  if (p === 'year') return d.slice(0, 4) === t.slice(0, 4);
  const n = daysBetween(d, t); return n >= 0 && n <= 30;
}
const periodPicker = () => `<div class="seg">${PERIODS.map(([v, l]) => `<button class="${UI.period === v ? 'on' : ''}" data-act="period" data-v="${v}">${l}</button>`).join('')}</div>`;
function parseTimes(s) {
  const out = [];
  String(s || '').replace(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?/gi, (m, h, mi, ap) => {
    h = +h; mi = +(mi || 0);
    if (ap) { ap = ap.toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
    if (h < 24 && mi < 60) out.push(String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0'));
  });
  return [...new Set(out)].sort();
}

  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.l}</th>`).join('')}${o.noEdit ? '' : '<th></th>'}</tr></thead>
  <tbody>${rows.map(r => `<tr>${cols.map(c => cell(c, r)).join('')}${o.noEdit ? '' : `<td class="acts">${o.acts ? o.acts(r) : ''}${editBtns(col, r.id)}</td>`}</tr>`).join('')}</tbody>
  ${hasTot ? `<tfoot><tr>${cols.map((c, i) => `<td class="${c.n ? 'n' : ''}">${c.sum ? (c.sum === 'n' ? fmtN(sum(rows, c.sv || c.k)) : money(sum(rows, c.sv || c.k))) : (i === 0 ? 'Total' : '')}</td>`).join('')}${o.noEdit ? '' : '<td></td>'}</tr></tfoot>` : ''}
  </table></div>`;
}
function toolbar(key, {ent = true, col, preset, extra = '', addLabel, ents = ENTS} = {}) {
  const st = lst(key);
  return `<div class="toolbar">
    <label class="search">${I('search', 16)}<input type="search" placeholder="Search" value="${esc(st.q)}" data-search="${key}" aria-label="Search"></label>
    ${ent ? `<select data-entf="${key}" aria-label="Farm"><option value="">All farms</option>${ents.map(e => `<option ${st.ent === e ? 'selected' : ''}>${e}</option>`).join('')}</select>` : ''}
    ${extra}<span class="grow"></span>
    ${col ? `<button class="btn btn-ghost" data-act="csv" data-col="${col}">${I('download', 16)}CSV</button>${addBtn(col, preset, addLabel)}` : ''}
  </div>`;
}
function dateKey(col) { const f = SCHEMA[col].fields.find(f => f.t === 'date'); return f && f.k; }
function listBlock(col, o = {}) {
  const key = o.key || col, sc = SCHEMA[col];
  const hasEnt = sc.fields.some(f => f.k === 'ent') && !o.noEnt;
  const build = () => {
    const st = lst(key);
    let rows = S[col].filter(o.filter || (() => true)).filter(r => (!st.ent || r.ent === st.ent) && matchQ(col, r, st.q));
    const dk = dateKey(col);
    rows = o.sort ? rows.sort(o.sort) : dk ? rows.sort((a, b) => (b[dk] || '').localeCompare(a[dk] || '') || (b.created || 0) - (a.created || 0)) : rows;
    return table(col, rows, o);
  };
  REFRESH[key] = build;
  return toolbar(key, {ent: hasEnt, col, preset: o.preset, addLabel: o.addLabel, ents: o.ents}) + `<div id="tbl-${key}">${build()}</div>`;
}
function tabs(view, list) {
  const cur = list.some(t => t[0] === UI.tab[view]) ? UI.tab[view] : list[0][0];
  return [cur, `<div class="tabs"><div class="seg">${list.map(([v, l, n]) => `<button class="${v === cur ? 'on' : ''}" data-act="tab" data-view="${view}" data-v="${v}">${l}${n ? `<span class="cnt">${n}</span>` : ''}</button>`).join('')}</div></div>`];
}
function exportCSV(col) {
  const f = SCHEMA[col].fields;
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [f.map(x => q(x.l)).join(','), ...S[col].map(r => f.map(x => q(displayVal(x, r))).join(','))];
  download(`zims-agro-${col}-${today()}.csv`, '﻿' + lines.join('\n'), 'text/csv');
}

/* ============ forms ============ */
let F = null;
function resolveOpts(f) {
  const o = typeof f.o === 'function' ? f.o(F.rec) : f.o;
  return o.map(x => typeof x === 'object' ? x : {v: x, l: x});
}
function openForm(col, id, preset) {
  const sc = SCHEMA[col];
  if (col === 'rentals' && !S.tools.length) { toast('Add a tool first', 'info'); go('farm/rental'); return; }
  if (['mortality','weights','feedlog'].includes(col) && !S.batches.length) { toast('Add a livestock batch first', 'info'); go('farms'); return; }
  if (col === 'doses' && !S.medicines.length) { toast('Add the medicine first', 'info'); go('more/medicines'); setTimeout(() => openForm('medicines'), 60); return; }
  if (col === 'payroll' && !S.staff.length) { toast('Add a staff member first', 'info'); go('money'); return; }
  const existing = id && byId(col, id);
  const rec = existing ? {...existing} : {};
  F = {col, rec, isNew: !existing, touched: new Set(existing ? ['paid'] : [])};
  if (!existing) sc.fields.forEach(f => { if (f.def !== undefined) rec[f.k] = typeof f.def === 'function' ? f.def() : f.def; });
  Object.assign(rec, preset || {});
  sc.fields.forEach(f => { if (f.t === 'select' && f.req && !existing) { const o = resolveOpts(f); if (o.length && !o.some(x => String(x.v) === String(rec[f.k]))) rec[f.k] = o[0].v; } });
  if (sc.onChange) {
    if (!existing) sc.onChange(rec, '__init', F);
    Object.keys(preset || {}).forEach(k => sc.onChange(rec, k, F));
    if (!existing && col === 'payroll' && rec.staff) sc.onChange(rec, 'staff', F);
    if (!existing && col === 'rentals' && rec.tool) { sc.onChange(rec, 'tool', F); sc.onChange(rec, 'qty', F); }
  }
  $('#mTitle').textContent = (existing ? 'Edit ' : 'Add ') + sc.one;
  $('#mErr').textContent = '';
  renderForm();
  $('#dlg').showModal();
  const first = $('#mBody input:not([readonly]), #mBody select, #mBody textarea');
  if (first && window.innerWidth > 700) first.focus();
}
function renderForm() {
  const sc = SCHEMA[F.col];
  $('#mBody').innerHTML = sc.fields.filter(f => !f.hide || !f.hide(F.rec)).map(fieldHtml).join('');
}
function fieldHtml(f) {
  const v = F.rec[f.k] ?? '';
  let input;
  if (f.t === 'multi') {
    const vals = Array.isArray(v) ? v : [];
    input = `<div class="chips">${resolveOpts(f).map(o => `<button type="button" class="chip-btn ${vals.includes(o.v) ? 'on' : ''}" data-fmulti="${f.k}" data-v="${esc(o.v)}">${esc(o.l)}</button>`).join('')}</div>`;
  } else if (f.t === 'select') {
    const opts = resolveOpts(f);
    input = `<select name="${f.k}" id="f-${f.k}">${opts.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select>`;
  } else if (f.t === 'textarea') {
    input = `<textarea name="${f.k}" id="f-${f.k}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else {
    const list = f.list ? f.list() : null;
    input = `<input name="${f.k}" id="f-${f.k}" type="${f.t || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}"
      ${f.t === 'number' ? 'step="any" inputmode="decimal"' : ''} ${f.ro ? 'readonly tabindex="-1"' : ''} ${list ? `list="dl-${f.k}"` : ''} autocomplete="off">
      ${list ? `<datalist id="dl-${f.k}">${list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
  }
  return `<label class="fld ${f.full || f.t === 'textarea' ? 'full' : ''}"><span>${esc(f.l)}${f.req ? ' *' : ''}</span>${input}${f.help ? `<small>${esc(f.help)}</small>` : ''}</label>`;
}
$('#mBody').addEventListener('click', e => {
  const b = e.target.closest('[data-fmulti]'); if (!b || !F) return;
  const k = b.dataset.fmulti, s = new Set(Array.isArray(F.rec[k]) ? F.rec[k] : []);
  s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v); F.rec[k] = [...s]; b.classList.toggle('on');
});
$('#mBody').addEventListener('input', e => {
  const el = e.target; if (!el.name || !F) return;
  const sc = SCHEMA[F.col], f = sc.fields.find(x => x.k === el.name);
  F.rec[el.name] = el.value; F.touched.add(el.name);
  if (sc.onChange) sc.onChange(F.rec, el.name, F);
  if (f && f.rerender) { renderForm(); const again = $(`#mBody [name="${el.name}"]`); if (again) again.focus(); return; }
  $('#mBody').querySelectorAll('[name]').forEach(x => {
    if (x === el) return;
    const nv = String(F.rec[x.name] ?? '');
    if (x.value !== nv) x.value = nv;
  });
});
$('#frm').addEventListener('submit', async e => {
  e.preventDefault();
  const sc = SCHEMA[F.col], r = F.rec;
  const visible = sc.fields.filter(f => !f.hide || !f.hide(r));
  const missing = visible.filter(f => f.req && String(r[f.k] ?? '').trim() === '');
  if (missing.length) { $('#mErr').textContent = 'Please fill in: ' + missing.map(f => f.l).join(', '); return; }
  sc.fields.forEach(f => { if (f.t === 'number' && r[f.k] !== undefined && r[f.k] !== '') r[f.k] = num(r[f.k]); });
  delete r._autoDose;
  if (sc.validate) { const err = await sc.validate(r, F); if (err) { $('#mErr').textContent = err; return; } }
  let msg = 'Saved';
  if (F.isNew) {
    const recs = sc.expand ? sc.expand(r) : [r];
    recs.forEach((x, i) => { x.id = uid() + (recs.length > 1 ? i : ''); x.created = Date.now() + i; S[F.col].push(x); });
    if (recs.length > 1) msg = `${recs.length} doses planned`;
  } else { const i = S[F.col].findIndex(x => x.id === r.id); S[F.col][i] = r; }
  const savedCol = F.col, wasNew = F.isNew;
  save(); $('#dlg').close(); F = null; render(); toast(msg);
  if (SCHEMA[savedCol].afterSave) SCHEMA[savedCol].afterSave(r, wasNew);
});
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => $('#dlg').close()));

async function delRec(col, id) {
  const r = byId(col, id); if (!r) return;
  const label = r.name || r.label || r.title || r.item || r.desc || r.renter || r.text || (col === 'doses' ? nameOf('medicines', r.med) + ' on ' + fmtDate(r.date) : 'this record');
  if (col === 'batches') {
    if (!(await ask(`Delete batch "${label}"?\n\nIts death, weight, feed and medication records will be deleted too. Sales and expenses stay but are unlinked.`, {ok: 'Delete', danger: true}))) return;
    ['mortality','weights','feedlog','doses'].forEach(c => S[c] = S[c].filter(x => x.batch !== id));
    S.sales.forEach(x => { if (x.batch === id) x.batch = ''; });
    S.expenses.forEach(x => { if (x.batch === id) x.batch = ''; });
    if (ROUTE.includes(id)) ROUTE = 'farm/' + keyOf(r.ent);
  } else if (col === 'tools') {
    const n = S.rentals.filter(x => x.tool === id).length;
    if (!(await ask(`Delete tool "${label}"?` + (n ? `\n\nIts ${n} rental record(s) will also be deleted.` : ''), {ok: 'Delete', danger: true}))) return;
    S.rentals = S.rentals.filter(x => x.tool !== id);
  } else if (col === 'medicines') {
    const n = S.doses.filter(x => x.med === id).length;
    if (!(await ask(`Delete medicine "${label}"?` + (n ? `\n\nIts ${n} medication record(s) will also be deleted.` : ''), {ok: 'Delete', danger: true}))) return;
    S.doses = S.doses.filter(x => x.med !== id);
  } else if (col === 'staff') {
    if (!(await ask(`Delete ${label}?\n\nTip: set "Still working?" to No instead to keep their salary history readable.`, {ok: 'Delete', danger: true}))) return;
  } else if (!(await ask(`Delete "${label}"?`, {ok: 'Delete', danger: true}))) return;
  S[col] = S[col].filter(x => x.id !== id);
  save(); render(); toast('Deleted', 'trash-2');
}

/* ============ farms ============ */
const FARMS = [
  {k: 'catfish', ent: 'Catfish', art: 'fish', word: 'fish'},
  {k: 'broilers', ent: 'Broilers', art: 'chicken', word: 'birds'},
  {k: 'turkeys', ent: 'Turkeys', art: 'turkey', word: 'birds'},
  {k: 'snails', ent: 'Snails', art: 'snail', word: 'snails'}
];
const farmOf = k => FARMS.find(f => f.k === k);
const keyOf = ent => ent === 'Tool Plug' ? 'rental' : (FARMS.find(f => f.ent === ent) || FARMS[0]).k;
const wordOf = ent => (FARMS.find(f => f.ent === ent) || {word: 'animals'}).word;
const activeBatches = ent => S.batches.filter(b => b.status !== 'Closed' && (!ent || b.ent === ent));
const sec = (title, right = '') => `<div class="sec"><h2>${title}</h2>${right}</div>`;
const back = (href, label) => `<a class="back" href="${href}">${I('arrow-left', 16)}${esc(label)}</a>`;
const ri = ({icon = '', ic = '', title, sub = '', right = '', attrs = ''}) =>
  `<div class="ri ${attrs.includes('data-act') ? 'tap' : ''}" ${attrs}>${icon ? `<span class="ri-ico ${ic}">${I(icon, 18)}</span>` : ''}<div class="ri-main"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right ? `<div class="ri-right">${right}</div>` : ''}</div>`;
const editAttrs = (col, id) => `data-act="edit" data-col="${col}" data-id="${id}"`;
const tile = (l, v, cls = '') => `<div class="tile"><span>${l}</span><b class="${cls}">${v}</b></div>`;
function greet() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function money3(p, ent) {
  const L = ledger().filter(x => inPeriod(x.date, p) && (!ent || x.ent === ent));
  const i = sum(L.filter(x => x.dir === 'in'), 'amount'), o = sum(L.filter(x => x.dir === 'out'), 'amount');
  return {i, o, p: i - o, L};
}
const owedTotal = () => sum(S.sales, r => Math.max(0, num(r.total) - num(r.paid))) + sum(S.rentals, r => Math.max(0, num(r.amount) - num(r.paid)));

/* ============ money ============ */
function viewMoney() {
  const p = UI.period, pl = PERIODS.find(x => x[0] === p)[1].toLowerCase();
  const m = money3(p), mf = UI.moneyEnt || '';
  const ents = ENTS.map(e => { const a = m.L.filter(x => x.ent === e); return {e, i: sum(a.filter(x => x.dir === 'in'), 'amount'), o: sum(a.filter(x => x.dir === 'out'), 'amount')}; }).filter(r => r.i || r.o);
  const mx = Math.max(1, ...ents.map(r => Math.max(r.i, r.o)));
  const months = []; const d0 = new Date(); d0.setDate(1);
  for (let i = 5; i >= 0; i--) { const d = new Date(d0.getFullYear(), d0.getMonth() - i, 1); months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
  const all = ledger();
  const md = months.map(x => { const a = all.filter(y => (y.date || '').slice(0, 7) === x); return {m: x, i: sum(a.filter(y => y.dir === 'in'), 'amount'), o: sum(a.filter(y => y.dir === 'out'), 'amount')}; });
  const cmx = Math.max(1, ...md.map(x => Math.max(x.i, x.o)));
  const owing = [...S.sales.filter(r => num(r.total) - num(r.paid) > 0).map(r => ({r, col: 'sales', who: r.buyer || 'Buyer', what: r.item, bal: num(r.total) - num(r.paid), act: 'paidSale'})),
    ...S.rentals.filter(r => num(r.amount) - num(r.paid) > 0).map(r => ({r, col: 'rentals', who: r.renter, what: nameOf('tools', r.tool) + ' rental', bal: num(r.amount) - num(r.paid), act: 'paidRent'}))];
  const L = m.L.filter(x => !mf || x.ent === mf), shown = L.slice(0, UI.moneyMore ? 400 : 25);
  const ym = today().slice(0, 7);
  const staff = S.staff.filter(s => s.active !== 'No');
  return `<div class="stack">
  <section class="hero">
    <span class="eyebrow">Money · ${pl}</span>
    <div class="hero-num" style="margin-top:8px"><span>${m.p >= 0 ? 'Profit' : 'Loss'}</span><b>${money(m.p)}</b></div>
    <div class="hero-split"><div><span>Money in</span><b>${money(m.i)}</b></div><div><span>Money out</span><b>${money(m.o)}</b></div><div><span>Owed to you</span><b>${money(owedTotal())}</b></div></div>
    ${periodPicker()}
  </section>
  <div class="qrow">${qbtn('sale', {}, true)}${qbtn('expense')}${qbtn('pay')}<button class="qbtn" data-act="ledgerCsv"><span class="qi">${I('download', 20)}</span>Download</button></div>
  <div class="two">
    <section>${sec('Each farm')}<div class="box">${ents.length ? `<div class="hbars">${ents.map(r => `<div class="hbar"><span>${farm(r.e)}</span><div class="bars"><i style="width:${r.i / mx * 100}%;background:var(--gold)"></i><i style="width:${r.o / mx * 100}%;background:var(--ink)"></i></div><div class="v ${r.i - r.o >= 0 ? 'pos' : 'neg'}">${money(r.i - r.o)}<small>${money(r.i)} in · ${money(r.o)} out</small></div></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--gold)"></i>Money in</span><span><i style="background:var(--ink)"></i>Money out</span></div>` : `<p class="mute" style="margin:0">No money recorded ${pl}.</p>`}</div></section>
    <section>${sec('Last 6 months')}<div class="box"><div class="chart">
      <div class="gl" style="top:18px"><span>${money(cmx)}</span></div><div class="gl" style="top:calc(18px + (100% - 44px) / 2)"><span>${money(cmx / 2)}</span></div>
      ${md.map(x => `<div class="mon" title="${monthName(x.m)}: in ${money(x.i)}, out ${money(x.o)}"><div class="pair"><div class="bar in" style="height:${x.i / cmx * 100}%"></div><div class="bar out" style="height:${x.o / cmx * 100}%"></div></div><small>${monthName(x.m).split(' ')[0]}</small></div>`).join('')}
    </div><div class="legend"><span><i style="background:var(--gold)"></i>Money in</span><span><i style="background:var(--ink)"></i>Money out</span></div></div></section>
  </div>
  ${owing.length ? `<section>${sec(`Owed to you <small>${money(sum(owing, 'bal'))}</small>`)}<div class="list">${owing.map(o => ri({icon: 'user', ic: 'warn', title: esc(o.who), sub: `${esc(o.what)} · ${fmtDay(o.r.date || o.r.dateOut)}${o.r.phone ? ' · ' + esc(o.r.phone) : ''}`, right: `<span class="neg">${money(o.bal)}</span><button class="btn btn-sm btn-ghost" data-act="${o.act}" data-id="${o.r.id}">Paid</button>`, attrs: editAttrs(o.col, o.r.id)})).join('')}</div></section>` : ''}
  <section>${sec('Activity', `<div class="seg">${['', ...ENTS].map(e => `<button class="${mf === e ? 'on' : ''}" data-act="mf" data-v="${e}">${e || 'All'}</button>`).join('')}</div>`)}
    ${shown.length ? `<div class="list">${shown.map(x => ri({icon: x.dir === 'in' ? 'arrow-down-left' : 'arrow-up-right', ic: x.dir === 'in' ? 'gold' : '', title: esc(x.desc || x.cat), sub: `${farm(x.ent)} · ${esc(x.cat)} · ${fmtDay(x.date)}`, right: x.dir === 'in' ? `<span class="pos">+${money(x.amount)}</span>` : `-${money(x.amount)}`})).join('')}</div>
      ${L.length > shown.length ? `<div style="margin-top:12px"><button class="btn btn-ghost" data-act="moneyMore">Show all ${L.length}</button></div>` : ''}` : empty('Nothing in this period.', 'dollar-sign')}</section>
  ${monthReport()}
  ${topBuyers()}
  <section>${sec('Staff & salaries', addBtn('staff', {}, 'Add staff', 'btn btn-ghost btn-sm'))}
    ${staff.length ? `<div class="list">${staff.map(s => { const paid = sum(S.payroll.filter(x => x.staff === s.id && x.period === ym), 'net');
      return ri({icon: 'user', title: esc(s.name) + (s.role ? ` <span class="mute small" style="font-weight:500">${esc(s.role)}</span>` : ''), sub: `${money(s.rate)} / ${s.payType === 'Daily' ? 'day' : 'month'}${s.phone ? ' · ' + esc(s.phone) : ''}`,
        right: paid ? pill('Paid ' + money(paid), 'good') : `<button class="btn btn-sm btn-primary" data-act="q" data-q="pay" data-preset="${esc(JSON.stringify({staff: s.id}))}">Pay</button>`, attrs: editAttrs('staff', s.id)}); }).join('')}</div>` : empty('Add the people who work on the farm. Paying them takes two taps.', 'users')}
    ${S.payroll.length ? `<div class="list" style="margin-top:8px">${[...S.payroll].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 6).map(p => ri({icon: 'dollar-sign', title: `${esc(nameOf('staff', p.staff))} · ${p.period ? monthName(p.period) : ''}`, sub: fmtDay(p.date) + (num(p.deduct) ? ' · ' + money(p.deduct) + ' deducted' : ''), right: '-' + money(p.net), attrs: editAttrs('payroll', p.id)})).join('')}</div>` : ''}</section>
  </div>`;
}

function growthChart(b) {
  const ws = S.weights.filter(w => w.batch === b.id && w.date && num(w.avg)).sort((x, y) => x.date.localeCompare(y.date));

  const W = 320, H = 130, P = 14, xs = ws.map(w => new Date(w.date + 'T00:00').getTime()), ys = ws.map(w => num(w.avg));
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1, y1 = Math.max(...ys) * 1.1;
  const pt = (x, y) => [P + (x1 === x0 ? 0 : (x - x0) / (x1 - x0)) * (W - 2 * P), H - P - (y / y1) * (H - 2 * P)];
  const pts = ws.map((w, i) => pt(xs[i], ys[i]));
  const line = pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
  const area = `${P},${H - P} ${line} ${pts[pts.length - 1][0].toFixed(1)},${H - P}`;

  return `<section>${sec(`Growth <small>${fmtW(ys[0])} to ${fmtW(ys[ys.length - 1])}</small>`)}<div class="box">

}

/* ============ feed store ============ */
const feedStock = ent => S.inventory.filter(i => i.cat === 'Feed' && (!ent || !i.ent || i.ent === 'General' || i.ent === ent));
const kgPer = i => num(i.kgPer) || (/kg/i.test(i.unit || '') ? 1 : /bag/i.test(i.unit || '') ? 25 : 1);
function feedDaysLeft(i) {
  const since = addDays(today(), -7);
  const used = sum(S.feedlog.filter(f => f.stock === i.id && f.date && f.date > since), 'kg');
  if (!used) return null;
  return Math.floor(num(i.qty) * kgPer(i) / (used / 7));
}
function stockLabel(i) { const dl = feedDaysLeft(i); return `${fmtN(i.qty)} ${i.unit || ''} left${dl !== null ? ' · about ' + dl + ' day' + (dl === 1 ? '' : 's') : ''}`; }
function defaultStock(batch) {
  const f = [...S.feedlog].reverse().find(x => x.batch === batch && x.stock && byId('inventory', x.stock));
  if (f) return f.stock;
  const ft = lastFeed(batch).toLowerCase(), m = ft && feedStock(bEnt(batch)).find(i => i.item.toLowerCase() === ft);
  return m ? m.id : '';
}
const bEnt = batch => (byId('batches', batch) || {}).ent;
const lastKg = batch => { const f = [...S.feedlog].reverse().find(x => x.batch === batch); return f ? f.kg : ''; };
function addFeed(batch, kg, stockId, feedType, date) {
  const i = stockId && byId('inventory', stockId);
  add('feedlog', {date: date || today(), batch, feedType: i ? i.item : (feedType || lastFeed(batch)), kg, stock: i ? i.id : '', notes: ''});
  if (i) { i.qty = Math.max(0, round(num(i.qty) - kg / kgPer(i))); if (invStatus(i) !== 'ok') setTimeout(() => toast(`${i.item} is running low: ${stockLabel(i)}`, 'alert-circle'), 2600); }
}
function feedStockAdd(v) {
  const items = feedStock(), it = byId('inventory', v.stockAdd);
  return qf('Add it to your feed store?', chips('stockAdd', [...items.map(i => ({v: i.id, l: i.item, sub: `${fmtN(i.qty)} ${i.unit || ''} now`})), {v: 'new', l: 'New feed'}, {v: '', l: 'No'}], v.stockAdd ?? '') +
    (v.stockAdd === 'new' ? qin('newFeed', v.newFeed || '', {ph: 'Feed name, e.g. Broiler starter 25 kg'}) : '') +
    (v.stockAdd ? stepper('stockQty', v.stockQty ?? 1, {unit: it ? it.unit || 'bags' : 'bags'}) : ''));
}
function stockFromExpense(v) {
  if (!v.stockAdd || !num(v.stockQty)) return;
  if (v.stockAdd === 'new') add('inventory', {item: (v.newFeed || v.desc || 'Feed').trim(), cat: 'Feed', ent: v.ent, qty: num(v.stockQty), unit: 'bags', kgPer: 25, minQty: '', status: 'Have', shop: v.shop || '', price: round(num(v.amount) / num(v.stockQty)), notes: ''});
  else { const i = byId('inventory', v.stockAdd); if (i) { i.qty = round(num(i.qty) + num(v.stockQty)); i.status = 'Have'; if (num(v.amount)) i.price = round(num(v.amount) / num(v.stockQty)); } }
}

const SUGGESTED = {

    jobs: [['06:30', 'Check birds, wash and refill drinkers'], ['07:00', 'Feed: fill the feeders'], ['12:30', 'Top up feed and water'], ['17:30', 'Feed and water for the night, check heat and litter']]},
  Turkeys: {note: 'Turkeys also do best with feed and water available through the day. Keep poults warm and dry.',
    jobs: [['06:30', 'Check turkeys, wash and refill drinkers'], ['07:00', 'Feed turkeys'], ['12:30', 'Top up feed and water'], ['17:30', 'Feed and water for the night']]},
  Catfish: {note: 'Feeding about 2 hours after changing the water is good: the fish settle first. Juveniles grow better with a second feed in the evening.',
    jobs: [['07:00', 'Change tank water'], ['09:00', 'Feed fish (morning)'], ['17:00', 'Feed fish (evening)']]},
  Snails: {note: 'Snails feed mostly at night, so feed them in the evening and clear old food in the morning so it does not rot.',
    jobs: [['07:00', 'Remove leftover food, check for escapes'], ['18:00', 'Feed snails and sprinkle water on the soil']]}
};
function routinesFor(date) {
  const dom = +String(date).slice(8, 10);
  return S.routines.filter(r => r.freq === 'Once a month' ? num(r.day) === dom : r.freq === 'Every few days' ? isEveryDay(r, date) : true);
}
function isEveryDay(r, date) { const n = Math.max(1, Math.round(num(r.every) || 1)); return !!r.from && date >= r.from && daysBetween(r.from, date) % n === 0; }
function nextOn(r) { let d = today(); for (let i = 0; i < 400; i++) { if (r.freq === 'Once a month' ? +d.slice(8, 10) === (num(r.day) || 1) : r.freq === 'Every few days' ? isEveryDay(r, d) : true) return d; d = addDays(d, 1); } return today(); }
function todayBlocks(items) {
  if (!items.length) return sec('Today') + todayList(items);
  const morning = items.filter(x => x.time && x.time < '11:00'), evening = items.filter(x => x.time && x.time >= '16:00'), later = items.filter(x => !morning.includes(x) && !evening.includes(x));
