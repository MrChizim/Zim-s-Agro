    case 'expense': add('expenses', {date: a.date, ent: a.farm || 'General', cat: a.category, desc: a.description || a.category, qty: '', unitPrice: '', amount: num(a.amount), batch: '', batches: a.batchIds, shares: aliveShares(a.batchIds), shop: '', notes: 'Added by chat'}); return 'Expense saved';
    case 'feed_bought': {
      const open = S.bags.some(g => g.feed === a.feed && g.opened && !g.finished);
      for (let i = 0; i < num(a.bags); i++) add('bags', {feed: a.feed, price: num(a.pricePerBag), size: 25, bought: a.date, opened: !open && i === 0 ? a.date : '', finished: '', batches: [...a.batchIds], ent: bEnt(a.batchIds[0]) || 'Broilers', shop: '', notes: 'Added by chat'});
      return 'Feed bags saved';
    }
    case 'bag_finished': {
      const f = a.feed.toLowerCase();
      const g = unfinishedBags().find(x => x.feed.toLowerCase() === f) || unfinishedBags().find(x => x.feed.toLowerCase().includes(f) || f.includes(x.feed.toLowerCase()));
      if (!g) throw new Error(`No open bag of ${a.feed} found. Record the feed you bought first.`);
      finishBag(g, a.date, a.batchIds.length ? a.batchIds : (g.batches || []));
      return 'Bag marked as finished';
    }
    case 'death': add('mortality', {date: a.date, batch: a.batchId, count: num(a.count), cause: a.cause || '', action: '', notes: 'Added by chat'}); return 'Deaths recorded';
    case 'payment': {
      let left = num(a.amount); const name = a.buyer.trim().toLowerCase();
      const owing = S.sales.filter(s => (s.buyer || '').trim().toLowerCase() === name && num(s.total) - num(s.paid) > 0).sort((x, y) => (x.date || '').localeCompare(y.date || ''));
      if (!owing.length) throw new Error(`${a.buyer} does not owe anything in the app.`);
      owing.forEach(s => { if (left <= 0) return; const due = num(s.total) - num(s.paid), pay = Math.min(due, left); s.paid = round(num(s.paid) + pay); left -= pay; });
      return left > 0 ? `Payment saved. ${money(left)} more than they owed` : 'Payment saved';
    }
    case 'task': add('todos', {text: a.text, ent: 'General', due: a.due || '', notes: '', done: false}); return 'Task added';
  }
}

${JSON.stringify(farmContext())}

async function sendChat(text) {
  text = String(text || '').trim(); if (!text || chatBusy) return;
  if (!SAMPLE) { toast('The chat only works in the online app', 'info'); return; }
  CHAT.push({role: 'me', text}); saveChat();
  chatBusy = new AbortController(); if (ROUTE !== 'chat') go('chat'); else render();
  try {
    const res = await SAMPLE.json(chatPrompt(text), {modelTier: 'quick', cache: false, signal: chatBusy.signal});
    const acts = (Array.isArray(res && res.actions) ? res.actions : []).filter(a => a && typeof a === 'object').filter(checkAction).map(a => ({...a, status: 'pending'}));
    CHAT.push({role: 'ai', text: String((res && res.reply) || (acts.length ? 'Here is what I understood:' : 'Sorry, I did not get that. Try saying it another way.')), actions: acts});
  } catch (e) {
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'not_declared' || e.code === 'capability_disabled' || e.code === 'capability_removed')) { SAMPLE_OFF = true; CHAT.push({role: 'ai', text: 'The chat is switched off for this app. You can still record everything with the buttons.', actions: []}); }
    else if (e && e.code === 'cancelled') CHAT.push({role: 'ai', text: 'Stopped.', actions: []});
    else if (e && e.code === 'rate_limited') CHAT.push({role: 'ai', text: 'Too many messages right now. Please try again in a little while.', actions: []});
    else CHAT.push({role: 'ai', text: 'Something went wrong. Please try again.', actions: []});
  }
  chatBusy = null; saveChat(); render();
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
}

document.addEventListener('click', e => {
  if (e.target.closest('#sheet') && (e.target.closest('[data-q-set],[data-q-toggle],[data-q-step]'))) return;
  if (e.target.closest('a[href^="http"]')) return;
  const link = e.target.closest('a[href^="#/"]');
  if (link) { e.preventDefault(); if ($('#sheet').open) $('#sheet').close(); go(link.getAttribute('href')); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset, a = d.act;
  e.preventDefault();
  if (a === 'add') { if ($('#sheet').open) $('#sheet').close(); openForm(d.col, null, d.preset ? JSON.parse(d.preset) : {}); }
  else if (a === 'edit') openForm(d.col, d.id);
  else if (a === 'del') delRec(d.col, d.id);

    save(); render(); toast('Backup restored');

});
